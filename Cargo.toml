[workspace]
members = [
    "crates/omen-common",
    "crates/omend",
    "crates/omen-cli",
    "crates/omen-gui",
    "crates/omen-audio",
]
resolver = "2"

[profile.release]
strip = "symbols"

[workspace.package]
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alanfrancis442/omend"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", features = ["tokio"] }
