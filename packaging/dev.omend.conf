<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="dev.omend"/>
    <allow send_destination="dev.omend"/>
  </policy>
  <policy context="default">
    <deny send_destination="dev.omend"/>
    <allow send_destination="dev.omend" send_interface="dev.omend" send_member="GetStatus"/>
    <allow send_destination="dev.omend" send_interface="dev.omend" send_member="GetTemperatures"/>
    <allow send_destination="dev.omend" send_interface="dev.omend" send_member="GetFanSpeeds"/>
    <allow send_destination="dev.omend" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="dev.omend" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <!-- Membership grants persistent hardware control, including background audio.
       It is explicit administrator trust, not an active-session check. -->
  <policy group="omen">
    <allow send_destination="dev.omend"/>
  </policy>
</busconfig>
