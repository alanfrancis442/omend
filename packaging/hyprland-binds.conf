# Hyprland binds. omen-cli talks to the root daemon on the system bus.
bind = $mainMod, F1, exec, omen-cli fan --preset quiet
bind = $mainMod, F2, exec, omen-cli fan --preset balanced
bind = $mainMod, F3, exec, omen-cli fan --preset max
bind = $mainMod SHIFT, P, exec, omen-cli profile next
bind = $mainMod, O, exec, omen-gui
