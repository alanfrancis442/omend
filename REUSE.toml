version = 1

[[annotations]]
path = [
    ".github/**",
    "AGENTS.md",
    "README.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CHANGELOG.md",
    "rust-toolchain.toml",
    "REUSE.toml",
    "licensing/third-party/README.md",
    "licensing/third-party/manifest.json",
    ".gitignore",
    ".ignore",
