name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libfontconfig1-dev libfreetype6-dev libxcb1-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev dbus desktop-file-utils python3-venv
      - name: Toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --release --locked
      - name: Lints
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Staging installer
        run: sh packaging/test-install.sh
      - name: File-only hardware plan validation
        run: python3 packaging/validate-emergency-max.py --self-test
      - name: SPDX coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/omen-reuse"
          "$RUNNER_TEMP/omen-reuse/bin/pip" install reuse==6.2.0
          "$RUNNER_TEMP/omen-reuse/bin/reuse" lint
      - name: Native bundle and smoke checks
        run: sh packaging/build-release.sh --offline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-linux-bundle
          path: dist/*.tar.gz*
          if-no-files-found: error
