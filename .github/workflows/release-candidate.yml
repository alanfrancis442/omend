name: Review release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vVERSION tag (must match all workspace package versions)
        required: true
      license_reviewed_revision:
        description: Full commit SHA with completed dependency license review
        required: true
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libfontconfig1-dev libfreetype6-dev libxcb1-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev dbus desktop-file-utils python3-venv
      - name: Validate source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --release --locked
          cargo clippy --workspace --all-targets --release --locked -- -D warnings
          sh packaging/test-install.sh
          python3 packaging/validate-emergency-max.py --self-test
      - name: SPDX coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/omen-reuse"
          "$RUNNER_TEMP/omen-reuse/bin/pip" install reuse==6.2.0
          "$RUNNER_TEMP/omen-reuse/bin/reuse" lint
      - name: Build reviewed candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OMEND_LICENSE_REVIEWED_REVISION: ${{ inputs.license_reviewed_revision }}
        run: sh packaging/build-release.sh --offline --official "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-linux-candidate
          path: dist/*.tar.gz*
          if-no-files-found: error
# Deliberately no release publication or hardware-support certification.
