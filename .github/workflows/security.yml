name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies against current RustSec database
        run: |
          cargo audit --version
          cargo audit --file Cargo.lock
          git -C "$HOME/.cargo/advisory-db" rev-parse HEAD
      # Informational maintenance warnings remain visible. Known vulnerabilities fail.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/omen-gitleaks.XXXXXX")
          cd "$tool_dir"
          release_url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release_url/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          # Digests recorded from the official GitHub release API asset metadata.
          printf '%s  %s\n' 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae checksums.txt | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release_url/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks_8.30.1_linux_x64.tar.gz | sha256sum -c -
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print}' checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum -c selected.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan full fetched history with redacted findings
        run: gitleaks git --redact --no-banner --log-opts="--all" .
      - name: Stage tracked and nonignored working files
        env:
          SECRET_SCAN_STAGE: ${{ runner.temp }}/omen-secret-worktree
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          stage = Path(os.environ['SECRET_SCAN_STAGE'])
          stage.mkdir()
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--cached', '--others', '--exclude-standard']).split(b'\0')
          for raw in paths:
              if not raw:
                  continue
              relative = Path(os.fsdecode(raw))
              source = root / relative
              target = stage / relative
              if source.is_symlink():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(os.fsencode(os.readlink(source)))
              elif source.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
      - name: Scan staged working files with redacted findings
        env:
          SECRET_SCAN_STAGE: ${{ runner.temp }}/omen-secret-worktree
        run: gitleaks dir --redact --no-banner "$SECRET_SCAN_STAGE"
